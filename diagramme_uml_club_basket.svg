<svg viewBox="0 0 1160 1220" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, 'Courier New', monospace">
  <defs>
    <marker id="tri" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto">
      <path d="M0,0 L18,8 L0,16 Z" fill="#141418" stroke="#e8e6e1" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#e0554f" stroke-width="1.6"/>
    </marker>
    <marker id="diamond" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto">
      <path d="M1,6 L9,1 L17,6 L9,11 Z" fill="#e0554f" stroke="#e0554f"/>
    </marker>
  </defs>

  <rect width="1160" height="1220" fill="#141418"/>

  <!-- ===== HERITAGE LINES (drawn first, behind boxes) ===== -->
  <!-- Joueur -> Personne -->
  <polyline points="180,300 180,225 480,225 480,150" fill="none" stroke="#e8e6e1" stroke-width="1.6" marker-end="url(#tri)"/>
  <!-- Entraineur -> Personne -->
  <line x1="480" y1="300" x2="480" y2="150" stroke="#e8e6e1" stroke-width="1.6" marker-end="url(#tri)"/>
  <!-- Arbitre -> Personne -->
  <polyline points="800,300 800,225 480,225 480,150" fill="none" stroke="#e8e6e1" stroke-width="1.6" marker-end="url(#tri)"/>

  <!-- ===== ASSOCIATIONS / COMPOSITIONS ===== -->
  <!-- Club composition-> Equipe (diamond at Club) -->
  <line x1="480" y1="600" x2="230" y2="740" stroke="#e0554f" stroke-width="1.6" marker-start="url(#diamond)"/>
  <text x="330" y="655" fill="#e0554f" font-size="13">1</text>
  <text x="255" y="725" fill="#e0554f" font-size="13">0..*</text>

  <!-- Equipe composition-> Joueur (diamond at Equipe) -->
  <polyline points="180,740 180,470 180,375" fill="none" stroke="#e0554f" stroke-width="1.6" marker-start="url(#diamond)"/>
  <text x="188" y="500" fill="#e0554f" font-size="13">1..*</text>

  <!-- Equipe association-> Entraineur -->
  <polyline points="260,780 480,780 480,375" fill="none" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="770" fill="#e0554f" font-size="13">0..1</text>

  <!-- Equipe association-> Match (participe a) -->
  <line x1="330" y1="820" x2="560" y2="820" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="345" y="810" fill="#e0554f" font-size="12">participe à (2)</text>

  <!-- Match association-> Arbitre -->
  <polyline points="700,780 700,600 800,600 800,375" fill="none" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="705" y="595" fill="#e0554f" font-size="12">dirigé par</text>

  <!-- Match association-> Salle -->
  <line x1="640" y1="990" x2="640" y2="1040" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="648" y="1018" fill="#e0554f" font-size="12">se joue dans</text>

  <!-- Club association-> Sponsor -->
  <line x1="600" y1="530" x2="900" y2="600" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="700" y="555" fill="#e0554f" font-size="12">financé par</text>

  <!-- ===== CLASS: Personne (abstract) ===== -->
  <g>
    <rect x="360" y="30" width="240" height="120" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="360" y="30" width="240" height="30" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="480" y="50" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle" font-style="italic">«abstract» Personne</text>
    <line x1="360" y1="94" x2="600" y2="94" stroke="#e8e6e1" stroke-width="1"/>
    <text x="370" y="76" fill="#c9c7c2" font-size="13">- id : int</text>
    <text x="370" y="92" fill="#c9c7c2" font-size="13">- nom, prenom : string</text>
    <text x="370" y="108" fill="#c9c7c2" font-size="13">- age : int</text>
    <text x="370" y="128" fill="#7ee0c4" font-size="13" font-style="italic">+ Role() : string</text>
  </g>

  <!-- ===== CLASS: Joueur ===== -->
  <g>
    <rect x="70" y="300" width="220" height="130" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="70" y="300" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="180" y="319" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Joueur</text>
    <line x1="70" y1="362" x2="290" y2="362" stroke="#e8e6e1" stroke-width="1"/>
    <text x="80" y="346" fill="#c9c7c2" font-size="13">- numero : int</text>
    <text x="80" y="358" fill="#c9c7c2" font-size="13">- poste : string</text>
    <text x="80" y="378" fill="#e8e6e1" font-size="13">+ Jouer() : void</text>
    <text x="80" y="396" fill="#7ee0c4" font-size="13">+ Role() : string</text>
  </g>

  <!-- ===== CLASS: Entraineur ===== -->
  <g>
    <rect x="370" y="300" width="220" height="130" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="370" y="300" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="480" y="319" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Entraineur</text>
    <line x1="370" y1="362" x2="590" y2="362" stroke="#e8e6e1" stroke-width="1"/>
    <text x="380" y="346" fill="#c9c7c2" font-size="13">- experience : int</text>
    <text x="380" y="358" fill="#c9c7c2" font-size="13">- licence : string</text>
    <text x="380" y="378" fill="#e8e6e1" font-size="13">+ Coacher() : void</text>
    <text x="380" y="396" fill="#7ee0c4" font-size="13">+ Role() : string</text>
  </g>

  <!-- ===== CLASS: Arbitre ===== -->
  <g>
    <rect x="690" y="300" width="220" height="130" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="690" y="300" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="800" y="319" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Arbitre</text>
    <line x1="690" y1="362" x2="910" y2="362" stroke="#e8e6e1" stroke-width="1"/>
    <text x="700" y="346" fill="#c9c7c2" font-size="13">- niveau : string</text>
    <text x="700" y="358" fill="#c9c7c2" font-size="13">- licence : string</text>
    <text x="700" y="378" fill="#e8e6e1" font-size="13">+ Arbitrer() : void</text>
    <text x="700" y="396" fill="#7ee0c4" font-size="13">+ Role() : string</text>
  </g>

  <!-- ===== CLASS: Club ===== -->
  <g>
    <rect x="380" y="450" width="220" height="130" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="380" y="450" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="490" y="469" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Club</text>
    <line x1="380" y1="512" x2="600" y2="512" stroke="#e8e6e1" stroke-width="1"/>
    <text x="390" y="496" fill="#c9c7c2" font-size="13">- nom, ville : string</text>
    <text x="390" y="508" fill="#c9c7c2" font-size="13">- budget : double</text>
    <text x="390" y="528" fill="#e8e6e1" font-size="12">+ AjouterEquipe(e:</text>
    <text x="390" y="542" fill="#e8e6e1" font-size="12">    Equipe) : void</text>
    <text x="390" y="560" fill="#e8e6e1" font-size="12">+ AjouterSponsor() : void</text>
  </g>

  <!-- ===== CLASS: Sponsor ===== -->
  <g>
    <rect x="850" y="590" width="220" height="110" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="850" y="590" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="960" y="609" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Sponsor</text>
    <line x1="850" y1="652" x2="1070" y2="652" stroke="#e8e6e1" stroke-width="1"/>
    <text x="860" y="636" fill="#c9c7c2" font-size="13">- nom : string</text>
    <text x="860" y="648" fill="#c9c7c2" font-size="13">- montant : double</text>
    <text x="860" y="668" fill="#e8e6e1" font-size="13">+ Financer() : void</text>
  </g>

  <!-- ===== CLASS: Equipe ===== -->
  <g>
    <rect x="70" y="740" width="220" height="120" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="70" y="740" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="180" y="759" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Equipe</text>
    <line x1="70" y1="802" x2="290" y2="802" stroke="#e8e6e1" stroke-width="1"/>
    <text x="80" y="786" fill="#c9c7c2" font-size="13">- nom : string</text>
    <text x="80" y="798" fill="#c9c7c2" font-size="13">- division : string</text>
    <text x="80" y="818" fill="#e8e6e1" font-size="13">+ AjouterJoueur() : void</text>
  </g>

  <!-- ===== CLASS: Match ===== -->
  <g>
    <rect x="530" y="740" width="220" height="150" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="530" y="740" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="640" y="759" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Match</text>
    <line x1="530" y1="822" x2="750" y2="822" stroke="#e8e6e1" stroke-width="1"/>
    <text x="540" y="786" fill="#c9c7c2" font-size="13">- date : DateTime</text>
    <text x="540" y="798" fill="#c9c7c2" font-size="13">- score : string</text>
    <text x="540" y="810" fill="#c9c7c2" font-size="12" font-style="italic">(adversaire retiré →</text>
    <text x="540" y="822" fill="#c9c7c2" font-size="12" font-style="italic">  géré par association)</text>
    <text x="540" y="842" fill="#e8e6e1" font-size="13">+ Jouer() : void</text>
    <text x="540" y="858" fill="#e8e6e1" font-size="13">+ DefinirScore() : void</text>
  </g>

  <!-- ===== CLASS: Salle ===== -->
  <g>
    <rect x="530" y="1040" width="220" height="80" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="530" y="1040" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="640" y="1059" fill="#e8e6e1" font-size="15" font-weight="bold" text-anchor="middle">Salle</text>
    <line x1="530" y1="1102" x2="750" y2="1102" stroke="#e8e6e1" stroke-width="1"/>
    <text x="540" y="1086" fill="#c9c7c2" font-size="13">- nom : string</text>
    <text x="540" y="1098" fill="#c9c7c2" font-size="13">- capacite : int</text>
  </g>

  <!-- ===== Title & Legend ===== -->
  <text x="580" y="1180" fill="#e8e6e1" font-size="20" font-weight="bold" text-anchor="middle">Gestion d'un Club de Basket</text>
  <text x="580" y="1200" fill="#9a9aa2" font-size="12" text-anchor="middle">Projet C# · Programmation Orientée Objet · UML</text>

  <g transform="translate(60,1155)">
    <polygon points="0,0 9,-9 18,0" fill="#141418" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="26" y="4" fill="#c9c7c2" font-size="12">Héritage</text>
    <line x1="130" y1="-4" x2="150" y2="-4" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="158" y="0" fill="#c9c7c2" font-size="12">Association</text>
    <path d="M266,-4 L274,-9 L282,-4 L274,1 Z" fill="#e0554f"/>
    <text x="290" y="0" fill="#c9c7c2" font-size="12">Composition</text>
  </g>
</svg>
