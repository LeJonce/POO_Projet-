<svg viewBox="0 0 1100 980" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, 'Courier New', monospace">
  <defs>
    <marker id="tri" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto">
      <path d="M0,0 L18,8 L0,16 Z" fill="#141418" stroke="#e8e6e1" stroke-width="1.5"/>
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#e0554f" stroke-width="1.6"/>
    </marker>
    <marker id="diamond" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto">
      <path d="M1,6 L9,1 L17,6 L9,11 Z" fill="#e0554f" stroke="#e0554f"/>
    </marker>
  </defs>

  <rect width="1100" height="980" fill="#141418"/>

  <!-- HERITAGE -->
  <polyline points="200,305 200,190 520,190 520,150" fill="none" stroke="#e8e6e1" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="520" y1="305" x2="520" y2="150" stroke="#e8e6e1" stroke-width="1.6" marker-end="url(#tri)"/>
  <polyline points="840,305 840,190 520,190 520,150" fill="none" stroke="#e8e6e1" stroke-width="1.6" marker-end="url(#tri)"/>

  <!-- ASSOCIATIONS / COMPOSITION -->
  <!-- Agence composition -> Vehicule (via Voiture, représentatif du lien vers la superclasse) -->
  <polyline points="200,470 200,430" fill="none" stroke="#e0554f" stroke-width="1.6" marker-start="url(#diamond)"/>
  <text x="205" y="410" fill="#e0554f" font-size="12">0..*</text>

  <!-- Camion -> Chauffeur -->
  <line x1="840" y1="430" x2="840" y2="470" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="845" y="455" fill="#e0554f" font-size="12">0..1</text>

  <!-- Location -> Client -->
  <line x1="390" y1="700" x2="300" y2="700" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="315" y="690" fill="#e0554f" font-size="12">1</text>

  <!-- Location -> Vehicule -->
  <polyline points="510,650 510,550 520,430" fill="none" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="520" y="550" fill="#e0554f" font-size="12">1</text>

  <!-- Location -> Assurance -->
  <line x1="630" y1="700" x2="730" y2="700" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="645" y="690" fill="#e0554f" font-size="12">0..1</text>

  <!-- ===== CLASS: Vehicule (abstract) ===== -->
  <g>
    <rect x="390" y="30" width="260" height="135" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="390" y="30" width="260" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="520" y="49" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Vehicule</text>
    <line x1="390" y1="92" x2="650" y2="92" stroke="#e8e6e1" stroke-width="1"/>
    <text x="400" y="74" fill="#c9c7c2" font-size="12">- marque, modele : string</text>
    <text x="400" y="88" fill="#c9c7c2" font-size="12">- immatriculation : string</text>
    <text x="400" y="102" fill="#c9c7c2" font-size="12">- tarifDeBase : double</text>
    <text x="400" y="122" fill="#7ee0c4" font-size="12">+ CalculerTarifJournalier() : double</text>
    <text x="400" y="136" fill="#7ee0c4" font-size="12">+ Decrire() : string</text>
  </g>

  <!-- ===== Voiture ===== -->
  <g>
    <rect x="90" y="305" width="220" height="125" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="90" y="305" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="200" y="324" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Voiture</text>
    <line x1="90" y1="367" x2="310" y2="367" stroke="#e8e6e1" stroke-width="1"/>
    <text x="100" y="351" fill="#c9c7c2" font-size="12">- nombrePlaces : int</text>
    <text x="100" y="363" fill="#c9c7c2" font-size="12">- typeCarburant : string</text>
    <text x="100" y="383" fill="#7ee0c4" font-size="12">+ CalculerTarifJournalier()</text>
    <text x="100" y="397" fill="#7ee0c4" font-size="12">+ Decrire() : string</text>
  </g>

  <!-- ===== Moto ===== -->
  <g>
    <rect x="410" y="305" width="220" height="125" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="410" y="305" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="520" y="324" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Moto</text>
    <line x1="410" y1="367" x2="630" y2="367" stroke="#e8e6e1" stroke-width="1"/>
    <text x="420" y="351" fill="#c9c7c2" font-size="12">- cylindree : int</text>
    <text x="420" y="383" fill="#7ee0c4" font-size="12">+ CalculerTarifJournalier()</text>
    <text x="420" y="397" fill="#7ee0c4" font-size="12">+ Decrire() : string</text>
  </g>

  <!-- ===== Camion ===== -->
  <g>
    <rect x="730" y="305" width="220" height="125" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="730" y="305" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="840" y="324" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Camion</text>
    <line x1="730" y1="367" x2="950" y2="367" stroke="#e8e6e1" stroke-width="1"/>
    <text x="740" y="351" fill="#c9c7c2" font-size="12">- capaciteChargement : double</text>
    <text x="740" y="383" fill="#7ee0c4" font-size="12">+ CalculerTarifJournalier()</text>
    <text x="740" y="397" fill="#7ee0c4" font-size="12">+ Decrire() : string</text>
    <text x="740" y="411" fill="#e8e6e1" font-size="11">+ AssignerChauffeur() : void</text>
  </g>

  <!-- ===== Agence ===== -->
  <g>
    <rect x="90" y="470" width="220" height="110" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="90" y="470" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="200" y="489" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Agence</text>
    <line x1="90" y1="532" x2="310" y2="532" stroke="#e8e6e1" stroke-width="1"/>
    <text x="100" y="516" fill="#c9c7c2" font-size="12">- nom, ville : string</text>
    <text x="100" y="548" fill="#e8e6e1" font-size="12">+ AjouterVehicule(v) : void</text>
  </g>

  <!-- ===== Chauffeur ===== -->
  <g>
    <rect x="730" y="470" width="220" height="110" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="730" y="470" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="840" y="489" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Chauffeur</text>
    <line x1="730" y1="532" x2="950" y2="532" stroke="#e8e6e1" stroke-width="1"/>
    <text x="740" y="516" fill="#c9c7c2" font-size="12">- nom, prenom : string</text>
    <text x="740" y="548" fill="#e8e6e1" font-size="12">+ Conduire() : void</text>
  </g>

  <!-- ===== Client ===== -->
  <g>
    <rect x="90" y="650" width="200" height="100" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="90" y="650" width="200" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="190" y="669" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Client</text>
    <line x1="90" y1="712" x2="290" y2="712" stroke="#e8e6e1" stroke-width="1"/>
    <text x="100" y="696" fill="#c9c7c2" font-size="12">- id : int</text>
    <text x="100" y="708" fill="#c9c7c2" font-size="12">- nom, prenom : string</text>
    <text x="100" y="730" fill="#c9c7c2" font-size="12">- numeroPermis : string</text>
  </g>

  <!-- ===== Location ===== -->
  <g>
    <rect x="390" y="650" width="240" height="140" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="390" y="650" width="240" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="510" y="669" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Location</text>
    <line x1="390" y1="732" x2="630" y2="732" stroke="#e8e6e1" stroke-width="1"/>
    <text x="400" y="696" fill="#c9c7c2" font-size="12">- dateDebut, dateFin : DateTime</text>
    <text x="400" y="710" fill="#c9c7c2" font-size="12">- prixTotal : double</text>
    <text x="400" y="750" fill="#e8e6e1" font-size="12">+ CalculerPrix() : void</text>
    <text x="400" y="764" fill="#e8e6e1" font-size="12">+ TerminerLocation() : void</text>
  </g>

  <!-- ===== Assurance ===== -->
  <g>
    <rect x="730" y="650" width="220" height="100" fill="#1e1e23" stroke="#e8e6e1" stroke-width="1.5"/>
    <rect x="730" y="650" width="220" height="28" fill="#2a2a30" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="840" y="669" fill="#e8e6e1" font-size="14" font-weight="bold" text-anchor="middle">Assurance</text>
    <line x1="730" y1="712" x2="950" y2="712" stroke="#e8e6e1" stroke-width="1"/>
    <text x="740" y="696" fill="#c9c7c2" font-size="12">- type : string</text>
    <text x="740" y="708" fill="#c9c7c2" font-size="12">- montantJournalier : double</text>
    <text x="740" y="730" fill="#e8e6e1" font-size="12">+ Souscrire() : void</text>
  </g>

  <!-- Title & Legend -->
  <text x="520" y="900" fill="#e8e6e1" font-size="18" font-weight="bold" text-anchor="middle">Gestion d'une Agence de Location de Véhicules</text>
  <text x="520" y="920" fill="#9a9aa2" font-size="12" text-anchor="middle">Projet C# · Programmation Orientée Objet · UML</text>

  <g transform="translate(60,875)">
    <polygon points="0,0 9,-9 18,0" fill="#141418" stroke="#e8e6e1" stroke-width="1.5"/>
    <text x="26" y="4" fill="#c9c7c2" font-size="12">Héritage</text>
    <line x1="130" y1="-4" x2="150" y2="-4" stroke="#e0554f" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="158" y="0" fill="#c9c7c2" font-size="12">Association</text>
    <path d="M266,-4 L274,-9 L282,-4 L274,1 Z" fill="#e0554f"/>
    <text x="290" y="0" fill="#c9c7c2" font-size="12">Composition</text>
  </g>
</svg>
